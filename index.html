<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Nuggets & Friends — Tap to Catch!</title>
<style>
  :root{
    --sys:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --ink:#4a2c5e;--soft:#fff;--pink:#ff8fb1;--gold:#ffc94d;--mint:#7fe3c4;--lav:#b9a6ff;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overscroll-behavior:none}
  body{
    font-family:var(--sys);color:var(--ink);
    background:linear-gradient(170deg,#ffe6f2 0%,#fff2d9 38%,#e2f7ff 72%,#efe6ff 100%);
    user-select:none;-webkit-user-select:none;touch-action:manipulation;overflow:hidden;
  }
  #stage{position:relative;width:100%;height:100%;overflow:hidden}

  /* clouds */
  .cloud{position:absolute;font-size:60px;opacity:.5;animation:float linear infinite;pointer-events:none}
  @keyframes float{from{transform:translateX(-140px)}to{transform:translateX(110vw)}}

  /* HUD */
  #hud{position:absolute;top:0;left:0;right:0;z-index:20;padding:12px 14px;
    display:flex;align-items:center;gap:10px;pointer-events:none}
  .pill{background:rgba(255,255,255,.82);backdrop-filter:blur(8px);border-radius:100px;
    padding:8px 16px;font-weight:800;font-size:19px;box-shadow:0 4px 14px rgba(120,80,160,.16);
    display:flex;align-items:center;gap:7px}
  #timeWrap{flex:1;height:14px;background:rgba(255,255,255,.7);border-radius:100px;overflow:hidden;
    box-shadow:0 4px 14px rgba(120,80,160,.16)}
  #timeBar{height:100%;width:100%;border-radius:100px;
    background:linear-gradient(90deg,var(--mint),var(--gold),var(--pink));transition:width .25s linear}
  .iconbtn{pointer-events:auto;background:rgba(255,255,255,.82);border:none;border-radius:100px;
    width:44px;height:44px;font-size:22px;cursor:pointer;box-shadow:0 4px 14px rgba(120,80,160,.16)}
  .iconbtn:active{transform:scale(.92)}

  /* falling items */
  .item{position:absolute;z-index:10;display:grid;place-items:center;cursor:pointer;
    will-change:transform;line-height:1}
  .item span{pointer-events:none;display:block}
  .item.special span{filter:drop-shadow(0 0 12px rgba(255,201,77,.95))}

  /* pop bits */
  .bit{position:absolute;z-index:15;pointer-events:none;font-weight:800;will-change:transform,opacity}

  /* screens */
  .screen{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:26px;
    background:rgba(255,255,255,.62);backdrop-filter:blur(14px)}
  .screen.hide{display:none}
  h1{font-size:clamp(34px,9vw,60px);line-height:1.02;letter-spacing:-.02em;margin-bottom:8px}
  .sub{font-size:17px;opacity:.7;margin-bottom:22px;font-weight:600}
  .themes{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:11px;
    width:100%;max-width:420px;margin-bottom:20px}
  .theme{background:#fff;border:3px solid transparent;border-radius:20px;padding:14px 8px;cursor:pointer;
    box-shadow:0 5px 16px rgba(120,80,160,.14);transition:transform .14s,border-color .14s}
  .theme:active{transform:scale(.95)}
  .theme.on{border-color:var(--pink);transform:translateY(-3px)}
  .theme .em{font-size:32px;display:block;margin-bottom:4px}
  .theme .nm{font-size:13px;font-weight:800}
  .modes{display:flex;gap:10px;margin-bottom:24px}
  .mode{background:#fff;border:3px solid transparent;border-radius:100px;padding:9px 20px;
    font-weight:800;font-size:14px;cursor:pointer;box-shadow:0 4px 12px rgba(120,80,160,.13)}
  .mode.on{border-color:var(--lav)}
  .mode:active{transform:scale(.95)}
  .big{border:none;border-radius:100px;padding:18px 46px;font-size:23px;font-weight:900;color:#fff;
    background:linear-gradient(100deg,var(--pink),var(--gold));cursor:pointer;
    box-shadow:0 10px 28px rgba(255,143,177,.5);animation:bob 2.2s ease-in-out infinite}
  .big:active{transform:scale(.95)}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .best{margin-top:18px;font-weight:800;opacity:.62;font-size:15px}
  .trophy{font-size:74px;animation:bob 1.6s ease-in-out infinite;margin-bottom:6px}
  .bigscore{font-size:78px;font-weight:900;line-height:1;
    background:linear-gradient(100deg,var(--pink),var(--gold));-webkit-background-clip:text;
    background-clip:text;color:transparent}
  @media(prefers-reduced-motion:reduce){.big,.trophy,.cloud{animation:none}}
</style>
</head>
<body>
<div id="stage">
  <div id="hud">
    <button class="iconbtn" id="homeBtn" aria-label="Menu">🏠</button>
    <div class="pill">⭐ <span id="score">0</span></div>
    <div id="timeWrap"><div id="timeBar"></div></div>
    <button class="iconbtn" id="sndBtn" aria-label="Sound">🔊</button>
  </div>

  <div class="screen" id="start">
    <h1>Nuggets &amp; Friends</h1>
    <div class="sub">Tap the falling things to catch them!</div>
    <div class="themes" id="themes"></div>
    <div class="modes">
      <button class="mode on" data-mode="round">⏱️ 30 Seconds</button>
      <button class="mode" data-mode="forever">♾️ Forever</button>
    </div>
    <button class="big" id="playBtn">Play!</button>
    <div class="best" id="bestStart"></div>
  </div>

  <div class="screen hide" id="end">
    <div class="trophy" id="trophy">🏆</div>
    <div class="sub" style="margin-bottom:2px" id="endMsg">You caught</div>
    <div class="bigscore" id="finalScore">0</div>
    <div class="best" id="bestEnd" style="margin-bottom:24px"></div>
    <button class="big" id="againBtn">Play Again!</button>
  </div>
</div>

<script>
(() => {
  const stage = document.getElementById('stage');
  const scoreEl = document.getElementById('score');
  const timeBar = document.getElementById('timeBar');
  const timeWrap = document.getElementById('timeWrap');
  const startScr = document.getElementById('start');
  const endScr = document.getElementById('end');
  const themesEl = document.getElementById('themes');
  const sndBtn = document.getElementById('sndBtn');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const THEMES = {
    nuggets:{ nm:'Nuggets', em:'🐶', items:['🐶','🐾','🦴','🎾','💛','🐕'] },
    rainbow:{ nm:'Rainbows', em:'🌈', items:['🌈','☁️','✨','⭐','🦄','🌤️'] },
    hearts:{  nm:'Hearts',   em:'💖', items:['💖','💕','💗','💜','💛','💞'] },
    crayons:{ nm:'Crayons',  em:'🖍️', items:['🖍️','🎨','✏️','🌟','📗','🖌️'] },
    yummy:{   nm:'Yummy',    em:'🍪', items:['🍪','🧁','🍓','🍦','🍩','🍯'] },
    every:{   nm:'Everything',em:'🎉', items:[] }
  };
  THEMES.every.items = ['🐶','🌈','💖','🖍️','🍪','🦄','⭐','🧁','🐾','✨','🎾','💜'];

  const SPECIAL = '🐶';           // Nuggets = big points
  const STAR = '⭐';

  let theme='nuggets', mode='round', playing=false, score=0, items=[], last=0;
  let timeLeft=60, spawnTimer=0, elapsed=0, best=0, sound=true, actx=null;

  /* ---------- sound (no files, tiny blips) ---------- */
  function blip(freq, dur=0.09, type='sine', vol=0.16){
    if(!sound) return;
    try{
      actx = actx || new (window.AudioContext||window.webkitAudioContext)();
      if(actx.state==='suspended') actx.resume();
      const o=actx.createOscillator(), g=actx.createGain();
      o.type=type; o.frequency.value=freq;
      g.gain.setValueAtTime(vol,actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+dur);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime+dur);
    }catch(e){}
  }
  const catchSound = () => blip(660+Math.random()*260,0.08,'sine',0.14);
  function specialSound(){
    [523,659,784,1047].forEach((f,i)=>setTimeout(()=>blip(f,0.13,'triangle',0.17),i*70));
  }
  function endSound(){
    [523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>blip(f,0.2,'triangle',0.15),i*110));
  }
  sndBtn.onclick = () => { sound=!sound; sndBtn.textContent = sound?'🔊':'🔇'; if(sound) blip(700); };

  /* ---------- best score ---------- */
  async function loadBest(){
    try{ const r = await window.storage.get('nuggets-best'); best = JSON.parse(r.value)||0; }
    catch(e){ best = 0; }
    paintBest();
  }
  async function saveBest(){
    try{ await window.storage.set('nuggets-best', JSON.stringify(best)); }catch(e){}
  }
  function paintBest(){
    const t = best>0 ? '🏅 Best ever: '+best : '';
    document.getElementById('bestStart').textContent = t;
  }

  /* ---------- clouds ---------- */
  ['☁️','☁️','🌤️'].forEach((c,i)=>{
    const d=document.createElement('div');
    d.className='cloud'; d.textContent=c;
    d.style.top=(9+i*24)+'%';
    d.style.animationDuration=(34+i*13)+'s';
    d.style.animationDelay=(-i*11)+'s';
    stage.appendChild(d);
  });

  /* ---------- theme picker ---------- */
  Object.entries(THEMES).forEach(([k,v],i)=>{
    const b=document.createElement('button');
    b.className='theme'+(i===0?' on':'');
    b.dataset.k=k;
    b.innerHTML='<span class="em">'+v.em+'</span><span class="nm">'+v.nm+'</span>';
    b.onclick=()=>{
      theme=k; blip(560,0.06);
      themesEl.querySelectorAll('.theme').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');
    };
    themesEl.appendChild(b);
  });
  document.querySelectorAll('.mode').forEach(m=>{
    m.onclick=()=>{
      mode=m.dataset.mode; blip(560,0.06);
      document.querySelectorAll('.mode').forEach(x=>x.classList.remove('on'));
      m.classList.add('on');
    };
  });

  /* ---------- spawning ---------- */
  function spawn(){
    if(items.length>22) return;
    const pool = THEMES[theme].items;
    const roll = Math.random();
    let ch, pts, special=false;
    if(roll<0.07){ ch=SPECIAL; pts=10; special=true; }
    else if(roll<0.17){ ch=STAR; pts=5; special=true; }
    else { ch=pool[(Math.random()*pool.length)|0]; pts=1; }

    const size = 54 + Math.random()*22;
    const el = document.createElement('div');
    el.className = 'item'+(special?' special':'');
    el.style.width=size+'px'; el.style.height=size+'px';
    el.innerHTML='<span style="font-size:'+(size*0.82)+'px">'+ch+'</span>';

    const it = {
      el, pts, special, ch,
      x: Math.random()*(stage.clientWidth-size),
      y: -size-10,
      vy: (special?0.9:1.15) + Math.min(elapsed/34,1.0) + Math.random()*0.55,
      sway: 10+Math.random()*26,
      ph: Math.random()*6.28,
      spin: (Math.random()-0.5)*3,
      rot: 0, size, dead:false
    };
    el.addEventListener('pointerdown', e=>{ e.preventDefault(); grab(it); }, {passive:false});
    stage.appendChild(el);
    items.push(it);
  }

  /* ---------- catching ---------- */
  function grab(it){
    if(it.dead || !playing) return;
    it.dead = true;
    score += it.pts;
    scoreEl.textContent = score;
    it.special ? specialSound() : catchSound();
    burst(it);
    it.el.remove();
    items = items.filter(x=>x!==it);
  }

  function burst(it){
    const cx = it.x + it.size/2, cy = it.y + it.size/2;

    const lbl = document.createElement('div');
    lbl.className='bit';
    lbl.textContent='+'+it.pts;
    lbl.style.cssText += ';left:'+cx+'px;top:'+cy+'px;font-size:'+(it.special?32:23)+'px;color:'+(it.special?'#ff8fb1':'#4a2c5e');
    stage.appendChild(lbl);
    anim(lbl, 700, p=>{
      lbl.style.transform='translate(-50%,'+(-50-p*46)+'%) scale('+(1+p*0.35)+')';
      lbl.style.opacity=String(1-p);
    });

    const n = it.special?11:6;
    const conf = it.special ? ['✨','🌟','💛','🎉'] : ['✨','💫','⭐'];
    for(let i=0;i<n;i++){
      const b=document.createElement('div');
      b.className='bit';
      b.textContent=conf[(Math.random()*conf.length)|0];
      b.style.cssText += ';left:'+cx+'px;top:'+cy+'px;font-size:'+(13+Math.random()*15)+'px';
      stage.appendChild(b);
      const a=Math.random()*6.28, d=44+Math.random()*80;
      anim(b, 620+Math.random()*260, p=>{
        const e=1-Math.pow(1-p,2.2);
        b.style.transform='translate(calc(-50% + '+Math.cos(a)*d*e+'px),calc(-50% + '+(Math.sin(a)*d*e+p*p*54)+'px)) rotate('+(p*260)+'deg)';
        b.style.opacity=String(1-p*p);
      });
    }
  }

  function anim(el, ms, step){
    const t0=performance.now();
    (function run(t){
      const p=Math.min((t-t0)/ms,1);
      step(p);
      p<1 ? requestAnimationFrame(run) : el.remove();
    })(t0);
  }

  /* ---------- loop ---------- */
  function loop(t){
    if(!playing) return;
    const dt = Math.min((t-last)/16.67, 3);
    last = t;
    elapsed += dt/60;

    spawnTimer -= dt;
    if(spawnTimer<=0){
      spawn();
      spawnTimer = Math.max(17, 44 - elapsed*1.7);
    }

    const H = stage.clientHeight;
    for(let i=items.length-1;i>=0;i--){
      const it=items[i];
      it.y += it.vy*dt;
      it.ph += 0.026*dt;
      it.rot += it.spin*dt*0.35;
      it.el.style.transform='translate('+(it.x+Math.sin(it.ph)*it.sway)+'px,'+it.y+'px) rotate('+it.rot+'deg)';
      if(it.y > H+70){ it.el.remove(); items.splice(i,1); }
    }

    if(mode==='round'){
      timeLeft -= dt/60;
      timeBar.style.width = Math.max(0,(timeLeft/60)*100)+'%';
      if(timeLeft<=0) return finish();
    }
    requestAnimationFrame(loop);
  }

  /* ---------- flow ---------- */
  function start(){
    score=0; elapsed=0; timeLeft=60; spawnTimer=0;
    scoreEl.textContent='0';
    items.forEach(i=>i.el.remove()); items=[];
    timeWrap.style.display = mode==='round' ? 'block' : 'none';
    timeBar.style.width='100%';
    startScr.classList.add('hide');
    endScr.classList.add('hide');
    playing=true; last=performance.now();
    blip(880,0.12,'triangle');
    requestAnimationFrame(loop);
  }

  function finish(){
    playing=false;
    items.forEach(i=>i.el.remove()); items=[];
    const isBest = score>best;
    if(isBest){ best=score; saveBest(); }
    document.getElementById('finalScore').textContent=score;
    document.getElementById('trophy').textContent = isBest?'🏆':(score>40?'🌟':'💖');
    document.getElementById('endMsg').textContent = isBest?'NEW BEST SCORE!':'You caught';
    document.getElementById('bestEnd').textContent = '🏅 Best ever: '+best;
    paintBest();
    endScr.classList.remove('hide');
    endSound();
  }

  document.getElementById('playBtn').onclick = start;
  document.getElementById('againBtn').onclick = start;
  document.getElementById('stage').addEventListener('contextmenu', e=>e.preventDefault());

  // forever mode: tap the score pill area to stop
  timeWrap.addEventListener('pointerdown', ()=>{ if(playing && mode==='forever') finish(); });

  loadBest();
})();
</script>
</body>
</html>
